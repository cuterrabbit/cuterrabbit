<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1124"/>
      <stop offset="0.55" stop-color="#0f1f38"/>
      <stop offset="1" stop-color="#123344"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#2fd4c8" stop-opacity="0.28"/>
      <stop offset="0.7" stop-color="#2fd4c8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#2fd4c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fur" cx="0.42" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#f2f4f8"/>
      <stop offset="1" stop-color="#ccd6e4"/>
    </radialGradient>
    <radialGradient id="furHead" cx="0.45" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#d3dcea"/>
    </radialGradient>
    <linearGradient id="earPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd3dd"/>
      <stop offset="1" stop-color="#f7a8bc"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#bfeef2" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="laptopBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3748"/>
      <stop offset="1" stop-color="#1c2531"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glowText" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1600" height="500" fill="url(#bg)"/>

  <!-- 서킷보드 장식 -->
  <g stroke="#2fd4c8" stroke-width="2" fill="none" opacity="0.14">
    <path d="M40 60 H180 V140 H300 V90 H420"/>
    <path d="M60 440 H220 V360 H340"/>
    <path d="M1560 80 H1420 V160 H1300 V110"/>
    <path d="M1540 430 H1380 V350 H1260 V400 H1150"/>
    <path d="M700 470 H860 V430"/>
  </g>
  <g fill="#2fd4c8" opacity="0.3">
    <circle cx="420" cy="90" r="5"/>
    <circle cx="340" cy="360" r="5"/>
    <circle cx="1300" cy="110" r="5"/>
    <circle cx="1150" cy="400" r="5"/>
    <circle cx="860" cy="430" r="5"/>
    <circle cx="40" cy="60" r="5"/>
    <circle cx="60" cy="440" r="5"/>
    <circle cx="1560" cy="80" r="5"/>
    <circle cx="1540" cy="430" r="5"/>
  </g>

  <!-- 토끼 스포트라이트 -->
  <circle cx="330" cy="250" r="215" fill="url(#spot)"/>
  <circle cx="330" cy="250" r="196" fill="none" stroke="#2fd4c8" stroke-opacity="0.35" stroke-width="2.5"/>

  <!-- 토끼 -->
  <g transform="translate(330 240)">
    <!-- 바닥 그림자 -->
    <ellipse cx="0" cy="188" rx="150" ry="26" fill="#000" opacity="0.35" filter="url(#soft)"/>

    <!-- 귀 -->
    <g>
      <ellipse cx="-52" cy="-148" rx="27" ry="74" transform="rotate(-14 -52 -148)" fill="url(#furHead)"/>
      <ellipse cx="-50" cy="-142" rx="14" ry="52" transform="rotate(-14 -50 -142)" fill="url(#earPink)"/>
      <ellipse cx="52" cy="-150" rx="27" ry="74" transform="rotate(12 52 -150)" fill="url(#furHead)"/>
      <ellipse cx="50" cy="-144" rx="14" ry="52" transform="rotate(12 50 -144)" fill="url(#earPink)"/>
    </g>

    <!-- 몸통 -->
    <ellipse cx="0" cy="98" rx="108" ry="88" fill="url(#fur)"/>
    <!-- 노트북 화면이 몸에 비치는 청록 빛 -->
    <ellipse cx="0" cy="120" rx="85" ry="55" fill="#37e0d8" opacity="0.10"/>

    <!-- 머리 -->
    <circle cx="0" cy="-28" r="88" fill="url(#furHead)"/>

    <!-- 볼 -->
    <ellipse cx="-58" cy="8" rx="16" ry="10" fill="#f7b7c6" opacity="0.55"/>
    <ellipse cx="58" cy="8" rx="16" ry="10" fill="#f7b7c6" opacity="0.55"/>

    <!-- 눈 (렌즈 뒤) -->
    <g>
      <circle cx="-33" cy="-36" r="10.5" fill="#2b3138"/>
      <circle cx="33" cy="-36" r="10.5" fill="#2b3138"/>
      <circle cx="-36.5" cy="-40" r="3.6" fill="#ffffff"/>
      <circle cx="29.5" cy="-40" r="3.6" fill="#ffffff"/>
    </g>

    <!-- 안경 (투명 렌즈) -->
    <g>
      <line x1="-64" y1="-46" x2="-84" y2="-52" stroke="#233040" stroke-width="5" stroke-linecap="round"/>
      <line x1="64" y1="-46" x2="84" y2="-52" stroke="#233040" stroke-width="5" stroke-linecap="round"/>
      <circle cx="-33" cy="-38" r="31" fill="url(#lens)" stroke="#233040" stroke-width="5.5"/>
      <circle cx="33" cy="-38" r="31" fill="url(#lens)" stroke="#233040" stroke-width="5.5"/>
      <path d="M-4 -42 Q0 -48 4 -42" fill="none" stroke="#233040" stroke-width="5" stroke-linecap="round"/>
      <!-- 렌즈 반사광 (눈 안 가리게 위쪽 가장자리) -->
      <path d="M-52 -54 Q-45 -61 -34 -62" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
      <path d="M14 -54 Q21 -61 32 -62" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- 코와 입 -->
    <path d="M-7 -2 Q0 -8 7 -2 Q0 8 -7 -2 Z" fill="#f48ba5"/>
    <path d="M0 4 Q0 14 -8 16 M0 4 Q0 14 8 16" fill="none" stroke="#c9a5ae" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 팔 -->
    <ellipse cx="-62" cy="128" rx="26" ry="20" transform="rotate(18 -62 128)" fill="url(#furHead)"/>
    <ellipse cx="62" cy="128" rx="26" ry="20" transform="rotate(-18 62 128)" fill="url(#furHead)"/>

    <!-- 노트북 (등판이 보이는 각도) -->
    <g>
      <rect x="-86" y="78" width="172" height="100" rx="10" fill="url(#laptopBack)"/>
      <rect x="-86" y="78" width="172" height="100" rx="10" fill="none" stroke="#37e0d8" stroke-opacity="0.5" stroke-width="2"/>
      <circle cx="0" cy="126" r="9" fill="#37e0d8" opacity="0.55"/>
      <rect x="-100" y="172" width="200" height="16" rx="7" fill="#3a4756"/>
      <rect x="-30" y="176" width="60" height="5" rx="2.5" fill="#242e3a"/>
      <!-- 화면 빛샘 -->
      <rect x="-86" y="74" width="172" height="7" rx="3.5" fill="#37e0d8" opacity="0.55" filter="url(#soft)"/>
    </g>
  </g>

  <!-- 반짝이 -->
  <g fill="#7fe3dc">
    <path d="M640 120 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5 Z" opacity="0.9"/>
    <path d="M1420 220 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4 Z" opacity="0.7"/>
    <path d="M1180 90 l3.5 10 10 3.5 -10 3.5 -3.5 10 -3.5 -10 -10 -3.5 10 -3.5 Z" opacity="0.6"/>
    <path d="M760 400 l3.5 10 10 3.5 -10 3.5 -3.5 10 -3.5 -10 -10 -3.5 10 -3.5 Z" opacity="0.55"/>
  </g>

  <!-- 타이틀 -->
  <g text-anchor="middle">
    <text x="1010" y="252" font-size="118" font-style="italic" fill="#37e0d8" opacity="0.65" filter="url(#glowText)">cuterrabbit</text>
    <text x="1010" y="252" font-size="118" font-style="italic" fill="#ffffff">cuterrabbit</text>
    <line x1="770" y1="300" x2="1250" y2="300" stroke="#2fd4c8" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="1010" y="352" font-family="Verdana, 'Segoe UI', sans-serif" font-size="30" letter-spacing="10" fill="#8fd9db">BACKEND · INFRA · AI ENGINEER</text>
  </g>
</svg>
